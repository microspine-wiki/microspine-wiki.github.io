<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-labelledby="t"><title id="t">Preload, drag and pull-off trajectory used to test a row of spines</title><desc>The base of a row of spines moves 4 millimetres toward the sample at 45 degrees, then 16 millimetres along the surface at 2.5 millimetres per second, then straight away from the surface until all spines release.</desc><rect x="0" y="0" width="720" height="268" fill="#ffffff"/><rect x="60" y="196" width="600" height="20" fill="#e8e8ed"/><line x1="60" y1="196" x2="660" y2="196" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="butt"/><rect x="60" y="216" width="600" height="12" fill="#d2d2d7"/><text x="360" y="246" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle"><tspan>sample (roofing paper) on a force plate</tspan></text><line x1="136" y1="100" x2="125" y2="134" stroke="#d2d2d7" stroke-width="2" stroke-linecap="round"/><line x1="145" y1="100" x2="134" y2="134" stroke="#d2d2d7" stroke-width="2" stroke-linecap="round"/><line x1="154" y1="100" x2="143" y2="134" stroke="#d2d2d7" stroke-width="2" stroke-linecap="round"/><line x1="163" y1="100" x2="152" y2="134" stroke="#d2d2d7" stroke-width="2" stroke-linecap="round"/><line x1="196" y1="160" x2="185" y2="194" stroke="#6e6e73" stroke-width="2" stroke-linecap="round"/><line x1="205" y1="160" x2="194" y2="194" stroke="#6e6e73" stroke-width="2" stroke-linecap="round"/><line x1="214" y1="160" x2="203" y2="194" stroke="#6e6e73" stroke-width="2" stroke-linecap="round"/><line x1="223" y1="160" x2="212" y2="194" stroke="#6e6e73" stroke-width="2" stroke-linecap="round"/><path d="M150 100L210 160L450 160L450 62.5" fill="none" stroke="#e8e8ed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="150" y1="100" x2="201.55" y2="151.55" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="206,156 197.73,152.45 202.45,147.73" fill="#0071e3" stroke-linejoin="round"/><line x1="218" y1="160" x2="435.7" y2="160" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="442,160 433.64,163.34 433.64,156.66" fill="#0071e3" stroke-linejoin="round"/><line x1="450" y1="152" x2="450" y2="68.8" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="450,62.5 453.34,70.86 446.66,70.86" fill="#0071e3" stroke-linejoin="round"/><circle cx="146" cy="78" r="9.5" fill="#1d1d1f"/><text x="146" y="82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text><text x="162" y="74" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>preload</tspan></text><text x="162" y="89" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>4 mm toward the surface, at 45°</tspan></text><circle cx="246" cy="126" r="9.5" fill="#1d1d1f"/><text x="246" y="130" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text><text x="262" y="122" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>drag</tspan></text><text x="262" y="137" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>16 mm along the surface,</tspan></text><text x="262" y="151" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>at 2.5 mm/s</tspan></text><circle cx="472" cy="96.5" r="9.5" fill="#1d1d1f"/><text x="472" y="100.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text><text x="488" y="92.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>pull-off</tspan></text><text x="488" y="107.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>straight out until</tspan></text><text x="488" y="121.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>every spine lets go</tspan></text><text x="124" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>row of</tspan></text><text x="124" y="166" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>ten toes</tspan></text></svg>
