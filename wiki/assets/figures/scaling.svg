<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" width="720" height="386" role="img" aria-labelledby="t"><title id="t">Idealised scaling of spine contact strength and asperity availability with tip radius</title><desc>Two log-log panels sharing a tip-radius axis from 1 to 1000 micrometres. Left: the load a single spine-asperity contact can carry grows as the square of tip radius. Right: the number of usable asperities per unit wall area falls as one over the square of tip radius. Typical microspine tips are 10 to 35 micrometres.</desc><rect x="0" y="0" width="720" height="386" fill="#ffffff"/><rect x="148" y="62" width="42.44" height="180" fill="#f5f5f7"/><line x1="70" y1="242" x2="304" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="70" y1="182" x2="304" y2="182" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="70" y1="122" x2="304" y2="122" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="70" y1="62" x2="304" y2="62" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="70" y1="62" x2="70" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="148" y1="62" x2="148" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="226" y1="62" x2="226" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="304" y1="62" x2="304" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="70" y1="242" x2="304" y2="242" stroke="#d2d2d7" stroke-width="1.25" stroke-linecap="butt"/><text x="70" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>1</tspan></text><text x="148" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>10</tspan></text><text x="226" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>100</tspan></text><text x="304" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>1000</tspan></text><text x="62" y="246" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>1</tspan></text><text x="62" y="186" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>10</tspan><tspan dy="-4.37" font-size="8.28">2</tspan></text><text x="62" y="126" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>10</tspan><tspan dy="-4.37" font-size="8.28">4</tspan></text><text x="62" y="66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>10</tspan><tspan dy="-4.37" font-size="8.28">6</tspan></text><text x="187" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle"><tspan>spine tip radius </tspan><tspan font-style="italic">r</tspan><tspan dy="3.36" font-size="8.64">s</tspan><tspan dy="-3.36"> (µm)</tspan></text><text x="30" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle" transform="rotate(-90 30 152)"><tspan>relative value</tspan></text><line x1="70" y1="242" x2="304" y2="62" stroke="#0071e3" stroke-width="2.25" stroke-linecap="round"/><text x="70" y="32" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>Load one contact can carry</tspan></text><text x="70" y="49" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>grows as </tspan><tspan font-style="italic">r</tspan><tspan dy="3.36" font-size="8.64">s</tspan><tspan dy="-7.92" font-size="8.64">2</tspan></text><text x="151" y="76" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6e6e73"><tspan>typical tips</tspan></text><rect x="514" y="62" width="42.44" height="180" fill="#f5f5f7"/><line x1="436" y1="242" x2="670" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="436" y1="182" x2="670" y2="182" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="436" y1="122" x2="670" y2="122" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="436" y1="62" x2="670" y2="62" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="436" y1="62" x2="436" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="514" y1="62" x2="514" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="592" y1="62" x2="592" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="670" y1="62" x2="670" y2="242" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="436" y1="242" x2="670" y2="242" stroke="#d2d2d7" stroke-width="1.25" stroke-linecap="butt"/><text x="436" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>1</tspan></text><text x="514" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>10</tspan></text><text x="592" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>100</tspan></text><text x="670" y="259" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>1000</tspan></text><text x="428" y="246" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>1</tspan></text><text x="428" y="186" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>10</tspan><tspan dy="-4.37" font-size="8.28">2</tspan></text><text x="428" y="126" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>10</tspan><tspan dy="-4.37" font-size="8.28">4</tspan></text><text x="428" y="66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>10</tspan><tspan dy="-4.37" font-size="8.28">6</tspan></text><text x="553" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle"><tspan>spine tip radius </tspan><tspan font-style="italic">r</tspan><tspan dy="3.36" font-size="8.64">s</tspan><tspan dy="-3.36"> (µm)</tspan></text><text x="396" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle" transform="rotate(-90 396 152)"><tspan>relative value</tspan></text><line x1="436" y1="62" x2="670" y2="242" stroke="#eb6834" stroke-width="2.25" stroke-linecap="round"/><text x="436" y="32" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>Usable asperities per unit of wall area</tspan></text><text x="436" y="49" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>fall as 1 / </tspan><tspan font-style="italic">r</tspan><tspan dy="3.36" font-size="8.64">s</tspan><tspan dy="-7.92" font-size="8.64">2</tspan></text><text x="517" y="234" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6e6e73"><tspan>typical tips</tspan></text><text x="436" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f"><tspan>Asperity sizes a surface offers</tspan></text><rect x="436" y="322" width="101.48" height="6" rx="3" fill="#6e6e73"/><text x="545.48" y="329" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>smooth concrete, stone panels</tspan></text><rect x="436" y="340" width="193.22" height="6" rx="3" fill="#6e6e73"/><text x="637.22" y="347" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>rough concrete</tspan></text><text x="70" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f"><tspan>Halve the tip radius:</tspan></text><text x="70" y="329" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>each contact holds a quarter of the load,</tspan></text><text x="70" y="344" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>but four times as many ledges are in reach.</tspan></text></svg>
