<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t"><title id="t">Why the lower rows of a rigid spine paddle disengage</title><desc>Panel A: a rigid plate with five rows of spines is loaded through a handle that stands off the wall. The outward component of the load turns the plate about its top rows, so the bottom rows lift off. Panel B: with the load applied nearly parallel to the wall through a long tether, all rows stay engaged.</desc><rect x="0" y="0" width="720" height="372" fill="#ffffff"/><line x1="368" y1="20" x2="368" y2="356" stroke="#e8e8ed" stroke-width="1" stroke-linecap="round"/><text x="24" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>A</tspan></text><text x="42" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>Rigid backing, load on a handle</tspan></text><rect x="40" y="52" width="56" height="282" fill="#e8e8ed"/><line x1="96" y1="52" x2="96" y2="334" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="butt"/><polygon points="112.95,80.05 128.99,263.35 140.95,262.3 124.91,79" fill="#48484a" stroke-linejoin="round"/><line x1="114.7" y1="99.97" x2="97" y2="111.97" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="97" cy="111.97" r="3.4" fill="#0071e3" stroke="#0071e3" stroke-width="1.5"/><line x1="117.83" y1="135.83" x2="97" y2="147.83" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="97" cy="147.83" r="3.4" fill="#0071e3" stroke="#0071e3" stroke-width="1.5"/><line x1="120.97" y1="171.7" x2="97.97" y2="183.7" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round"/><circle cx="97.97" cy="183.7" r="3.4" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><line x1="124.11" y1="207.56" x2="101.11" y2="219.56" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round"/><circle cx="101.11" cy="219.56" r="3.4" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><line x1="127.25" y1="243.42" x2="104.25" y2="255.42" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round"/><circle cx="104.25" cy="255.42" r="3.4" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><line x1="139.03" y1="240.38" x2="193.72" y2="291.81" stroke="#48484a" stroke-width="5" stroke-linecap="round"/><circle cx="193.72" cy="291.81" r="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/><line x1="193.72" y1="299.81" x2="213.38" y2="355.22" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="butt"/><polygon points="215.72,361.81 209.12,354.3 216.11,351.82" fill="#1d1d1f" stroke-linejoin="round"/><text x="221.72" y="331.81" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>load</tspan></text><text x="221.72" y="346.81" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>down and outward</tspan></text><path d="M182 116A64 64 0 0 1 200 196" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200,196 192,186 205,185" fill="#eb6834" stroke-linejoin="round"/><text x="212" y="150" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>the paddle turns</tspan></text><text x="212" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>about its top rows</tspan></text><text x="160" y="100" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>top rows pressed in</tspan></text><line x1="156" y1="100" x2="108" y2="106" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="192" y="236" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#c0001a"><tspan>bottom rows lift off:</tspan></text><text x="192" y="251" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#c0001a"><tspan>fewer spines carry the load</tspan></text><line x1="188" y1="240" x2="112.25" y2="255.42" stroke="#c0001a" stroke-width="1" stroke-linecap="round"/><text x="384" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>B</tspan></text><text x="402" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>Load line kept close to the wall</tspan></text><rect x="400" y="52" width="56" height="282" fill="#e8e8ed"/><line x1="456" y1="52" x2="456" y2="334" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="butt"/><polygon points="474,80 474,264 486,264 486,80" fill="#48484a" stroke-linejoin="round"/><line x1="474" y1="100" x2="457" y2="112" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="457" cy="112" r="3.4" fill="#0071e3" stroke="#0071e3" stroke-width="1.5"/><line x1="474" y1="136" x2="457" y2="148" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="457" cy="148" r="3.4" fill="#0071e3" stroke="#0071e3" stroke-width="1.5"/><line x1="474" y1="172" x2="457" y2="184" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="457" cy="184" r="3.4" fill="#0071e3" stroke="#0071e3" stroke-width="1.5"/><line x1="474" y1="208" x2="457" y2="220" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="457" cy="220" r="3.4" fill="#0071e3" stroke="#0071e3" stroke-width="1.5"/><line x1="474" y1="244" x2="457" y2="256" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/><circle cx="457" cy="256" r="3.4" fill="#0071e3" stroke="#0071e3" stroke-width="1.5"/><line x1="480" y1="264" x2="483" y2="300" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/><line x1="483" y1="300" x2="483.82" y2="331" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="butt"/><polygon points="484,338 480.05,328.81 487.46,328.62" fill="#1d1d1f" stroke-linejoin="round"/><text x="496" y="320" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>load, nearly parallel to the wall</tspan></text><text x="496" y="335" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>(a long tether to the foot)</tspan></text><text x="520" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>all rows stay on the wall</tspan></text><text x="520" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>Also helps: a compliant joint</tspan></text><text x="520" y="178" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>between rows and handle, rows that</tspan></text><text x="520" y="192" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>float separately, wider and shorter</tspan></text><text x="520" y="206" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>patches</tspan></text></svg>
