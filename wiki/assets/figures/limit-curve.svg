<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t"><title id="t">Limit curve of a spine–asperity contact in force space</title><desc>A wedge-shaped safe region bounded by a friction limit, an adhesion limit at angle theta-max below the shear axis, and a strength limit of radius F-star. The region passes through the origin.</desc><rect x="0" y="0" width="720" height="372" fill="#ffffff"/><path d="M214 118L193 34L539.3 34A336 336 0 0 1 510.7 275.7Z" fill="#e5f4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="118" x2="684.4" y2="118" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="690,118 682.57,120.97 682.57,115.03" fill="#6e6e73" stroke-linejoin="round"/><line x1="214" y1="344" x2="214" y2="27.6" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="214,22 216.97,29.43 211.03,29.43" fill="#6e6e73" stroke-linejoin="round"/><text x="690" y="108" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">s</tspan></text><text x="690" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>shear, along the wall</tspan></text><text x="204" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">n</tspan></text><text x="178" y="62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>pressing</tspan></text><text x="178" y="76" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>into the wall</tspan></text><text x="202" y="318" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>pulling out</tspan></text><text x="202" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>(adhesion)</tspan></text><line x1="214" y1="118" x2="193" y2="34" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/><line x1="214" y1="118" x2="510.67" y2="275.74" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/><path d="M539.3 34A336 336 0 0 1 510.7 275.7" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 118A96 96 0 0 1 298.76 163.07" fill="none" stroke="#6e6e73" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="326" y="169" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">θ</tspan><tspan dy="3.64" font-size="9.36">max</tspan></text><text x="388" y="84" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a7f37"><tspan>Safe region</tspan></text><text x="388" y="102" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1a7f37"><tspan>the contact holds</tspan></text><text x="66" y="176" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>Friction limit</tspan></text><text x="66" y="192" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>spine dragged back</tspan></text><text x="66" y="206" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>up the wall:</tspan></text><text x="66" y="222" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>−</tspan><tspan font-style="italic">F</tspan><tspan dy="3.36" font-size="8.64">s</tspan><tspan dy="-3.36"> ≤ </tspan><tspan font-style="italic">μ</tspan><tspan> </tspan><tspan font-style="italic">F</tspan><tspan dy="3.36" font-size="8.64">n</tspan></text><line x1="150" y1="164" x2="201.5" y2="86" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="300" y="262" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>Adhesion limit</tspan></text><text x="300" y="278" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>pull farther from the wall and</tspan></text><text x="300" y="292" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>the tip slides off its ledge:</tspan></text><text x="300" y="308" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>−</tspan><tspan font-style="italic">F</tspan><tspan dy="3.36" font-size="8.64">n</tspan><tspan dy="-3.36"> ≤ </tspan><tspan font-style="italic">F</tspan><tspan dy="3.36" font-size="8.64">s</tspan><tspan dy="-3.36"> tan </tspan><tspan font-style="italic">θ</tspan><tspan dy="3.36" font-size="8.64">max</tspan></text><line x1="382" y1="250" x2="404" y2="225.02" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="574" y="204" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>Strength limit</tspan></text><text x="574" y="220" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>spine bends or the</tspan></text><text x="574" y="234" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>asperity breaks:</tspan></text><text x="574" y="250" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>|</tspan><tspan font-style="italic">F</tspan><tspan>| ≤ </tspan><tspan font-style="italic">F</tspan><tspan>*</tspan></text><line x1="214" y1="118" x2="453.53" y2="166.55" stroke="#0071e3" stroke-width="2" stroke-linecap="butt"/><polygon points="459.02,167.67 451.15,169.1 452.32,163.28" fill="#0071e3" stroke-linejoin="round"/><text x="364" y="140" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>loading</tspan></text><circle cx="214" cy="118" r="4.5" fill="#0071e3" stroke="#ffffff" stroke-width="2"/><text x="226" y="108" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>origin: lets go at zero force</tspan></text></svg>
