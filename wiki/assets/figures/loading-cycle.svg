<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t"><title id="t">A spine attaching, loading and releasing, shown in space and in force space</title><desc>Left: a foot approaches the wall, drags its spine down until the tip catches a ledge, and keeps moving so the suspension stretches. Right: the tip force leaves the origin, grows along a loading curve inside the safe region, and then either hits the adhesion limit if the foot is pulled away from the wall or the strength limit if it is pulled too hard. Relaxing the load returns to the origin.</desc><rect x="0" y="0" width="720" height="372" fill="#ffffff"/><line x1="412" y1="20" x2="412" y2="352" stroke="#e8e8ed" stroke-width="1" stroke-linecap="round"/><text x="24" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>A</tspan></text><text x="42" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>What the foot does</tspan></text><polygon points="24,46 96,46 93,90 98,130 96,168 112,164 115,170 108,190 96,206 94,250 98,300 96,348 24,348" fill="#e8e8ed" stroke-linejoin="round"/><path d="M96 46L93 90L98 130L96 168L112 164L115 170L108 190L96 206L94 250L98 300L96 348" fill="none" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 96L206 148L206 322" fill="none" stroke="#e8e8ed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="258" y1="96" x2="217.46" y2="136.54" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="214,140 216.76,133.57 220.43,137.24" fill="#6e6e73" stroke-linejoin="round"/><line x1="212" y1="164" x2="212" y2="225.1" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="212,230 209.4,223.5 214.6,223.5" fill="#6e6e73" stroke-linejoin="round"/><path d="M102 74L133.2 96.2L132.32 101.1L141.01 96.23L139.26 106.03L147.94 101.17L146.19 110.97L154.88 106.1L153.12 115.9L161.81 111.03L160.06 120.83L168.74 115.97L166.99 125.77L175.68 120.9L174.8 125.8L206 148" fill="none" stroke="#d2d2d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="102" cy="74" r="3.4" fill="#d2d2d7"/><path d="M101 161L132.5 186.5L131.42 191.41L140.58 187.25L138.42 197.08L147.58 192.92L145.42 202.75L154.58 198.59L152.42 208.41L161.58 204.25L159.42 214.08L168.58 209.92L166.42 219.75L175.58 215.59L174.5 220.5L206 246" fill="none" stroke="#6e6e73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="101" cy="161" r="3.4" fill="#6e6e73"/><path d="M101 161L132.5 209.3L130.48 214.44L141.52 214.89L137.48 225.17L148.52 225.63L144.48 235.91L155.52 236.36L151.48 246.64L162.52 247.09L158.48 257.37L169.52 257.83L165.48 268.11L176.52 268.56L174.5 273.7L206 322" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="101" cy="161" r="3.4" fill="#1d1d1f"/><rect x="197" y="140" width="31" height="16" rx="3" fill="#d2d2d7"/><rect x="197" y="238" width="31" height="16" rx="3" fill="#6e6e73"/><rect x="197" y="314" width="31" height="16" rx="3" fill="#1d1d1f"/><circle cx="280" cy="82" r="9.5" fill="#1d1d1f"/><text x="280" y="86" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text><text x="296" y="86" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>approach</tspan></text><circle cx="252" cy="148" r="9.5" fill="#1d1d1f"/><text x="252" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text><text x="268" y="144" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>touch, then drag</tspan></text><text x="268" y="159" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>lightly down the wall</tspan></text><circle cx="252" cy="246" r="9.5" fill="#1d1d1f"/><text x="252" y="250" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text><text x="268" y="242" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>tip catches a ledge;</tspan></text><text x="268" y="257" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>the foot keeps moving</tspan></text><circle cx="252" cy="322" r="9.5" fill="#1d1d1f"/><text x="252" y="326" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>4</tspan></text><text x="268" y="318" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>suspension stretches</tspan></text><text x="268" y="333" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>and takes the load</tspan></text><text x="40" y="300" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>wall</tspan></text><text x="432" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>B</tspan></text><text x="450" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>The same cycle in force space</tspan></text><path d="M470 108L458 60L686.7 60A222 222 0 0 1 662.3 219.0Z" fill="#e5f4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="436" y1="108" x2="702.4" y2="108" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="708,108 700.57,110.97 700.57,105.03" fill="#6e6e73" stroke-linejoin="round"/><line x1="470" y1="318" x2="470" y2="55.6" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="470,50 472.97,57.43 467.03,57.43" fill="#6e6e73" stroke-linejoin="round"/><text x="706" y="99" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">s</tspan></text><text x="462" y="60" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">n</tspan></text><text x="462" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>adhesion</tspan></text><text x="606" y="76" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a7f37"><tspan>safe region</tspan></text><path d="M585.5 124.6Q530 92 486 103" fill="none" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="490" y="78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>relax to let go</tspan></text><path d="M474 96Q532 110 591.5 132.6" fill="none" stroke="#0071e3" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><line x1="591.53" y1="132.63" x2="683.93" y2="140.69" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="689.51,141.18 681.85,143.49 682.36,137.57" fill="#0071e3" stroke-linejoin="round"/><line x1="591.53" y1="132.63" x2="591.53" y2="170.56" stroke="#eb6834" stroke-width="2.25" stroke-linecap="butt"/><polygon points="591.53,176.16 588.56,168.74 594.5,168.74" fill="#eb6834" stroke-linejoin="round"/><circle cx="455" cy="123" r="9.5" fill="#1d1d1f"/><text x="455" y="127" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text><circle cx="480" cy="81" r="9.5" fill="#1d1d1f"/><text x="480" y="85" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text><circle cx="520" cy="132" r="9.5" fill="#1d1d1f"/><text x="520" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text><circle cx="595.53" cy="115.63" r="9.5" fill="#1d1d1f"/><text x="595.53" y="119.63" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>4</tspan></text><circle cx="574.53" cy="180.16" r="9.5" fill="#eb6834"/><text x="574.53" y="184.16" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>5</tspan></text><circle cx="687.51" cy="161.18" r="9.5" fill="#1d1d1f"/><text x="687.51" y="165.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan>6</tspan></text><text x="575.53" y="240.16" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>foot pulled away from the wall:</tspan></text><text x="575.53" y="254.16" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>the tip slides off at the adhesion limit</tspan></text><line x1="569.53" y1="190.16" x2="575.53" y2="226.16" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="706" y="191.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>pulled too hard:</tspan></text><text x="706" y="205.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>overload stop</tspan></text><text x="706" y="219.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>lets go</tspan></text></svg>
