, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>Each line stops where one</tspan></text><text x="552" y="127" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>hand would have to carry</tspan></text><text x="552" y="142" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>the whole weight:</tspan></text><text x="552" y="157" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1d1d1f"><tspan font-style="italic">h</tspan><tspan> / </tspan><tspan font-style="italic">L</tspan><tspan> = tan </tspan><tspan font-style="italic">θ</tspan><tspan dy="3.22" font-size="8.28">max</tspan><tspan dy="-3.22">.</tspan></text><circle cx="558" cy="196" r="6" fill="none" stroke="#1d1d1f" stroke-width="1.5"/><text x="572" y="200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f"><tspan>Worked example</tspan></text><text x="552" y="221" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan font-style="italic">h</tspan><tspan> / </tspan><tspan font-style="italic">L</tspan><tspan> = 0.17, </tspan><tspan font-style="italic">θ</tspan><tspan dy="3.22" font-size="8.28">max</tspan><tspan dy="-3.22"> = 15°:</tspan></text><text x="552" y="236" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>the hand carries 0.64 </tspan><tspan font-style="italic">W</tspan></text><text x="552" y="251" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>before any preload.</tspan></text></svg>
