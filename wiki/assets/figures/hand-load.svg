<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-labelledby="t"><title id="t">Load on the one supporting hand of a climber as a fraction of its weight</title><desc>A line chart. The load on the supporting hand divided by weight rises in proportion to h over L, with slope one over sine of theta-max, for theta-max of 10, 15, 20 and 30 degrees. Each line ends where h over L equals tan theta-max, where the hand would carry the whole weight.</desc><rect x="0" y="0" width="720" height="392" fill="#ffffff"/><line x1="78" y1="322" x2="508" y2="322" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="278.33" x2="508" y2="278.33" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="234.67" x2="508" y2="234.67" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="191" x2="508" y2="191" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="147.33" x2="508" y2="147.33" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="103.67" x2="508" y2="103.67" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="60" x2="508" y2="60" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="60" x2="78" y2="322" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="164" y1="60" x2="164" y2="322" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="250" y1="60" x2="250" y2="322" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="336" y1="60" x2="336" y2="322" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="422" y1="60" x2="422" y2="322" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="508" y1="60" x2="508" y2="322" stroke="#e8e8ed" stroke-width="1" stroke-linecap="butt"/><line x1="78" y1="322" x2="508" y2="322" stroke="#d2d2d7" stroke-width="1.25" stroke-linecap="butt"/><text x="70" y="326" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>0.0</tspan></text><text x="70" y="282.33" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>0.2</tspan></text><text x="70" y="238.67" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>0.4</tspan></text><text x="70" y="195" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>0.6</tspan></text><text x="70" y="151.33" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>0.8</tspan></text><text x="70" y="107.67" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>1.0</tspan></text><text x="70" y="64" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>1.2</tspan></text><text x="78" y="339" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>0.0</tspan></text><text x="164" y="339" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>0.1</tspan></text><text x="250" y="339" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>0.2</tspan></text><text x="336" y="339" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>0.3</tspan></text><text x="422" y="339" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="middle"><tspan>0.4</tspan></text><text x="508" y="339" font-family="Inter, 'Helv