<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t"><title id="t">The compliant-stalk model of a spine suspension</title><desc>A stalk of rest length r-zero runs from a pin at the spine tip on the wall to a pin at the base, at angle theta-zero from the wall. A stiff spring k-r resists stretching along the stalk and a weak torsion spring k-theta at the base presses the tip toward the wall. Moving the base toward the wall and down it stretches and rotates the stalk, producing shear and adhesion at the tip.</desc><rect x="0" y="0" width="720" height="400" fill="#ffffff"/><rect x="138" y="36" width="62" height="336" fill="#e8e8ed"/><line x1="200" y1="36" x2="200" y2="372" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="butt"/><text x="169" y="360" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle"><tspan>wall</tspan></text><line x1="200" y1="84" x2="300.68" y2="245.13" stroke="#d2d2d7" stroke-width="5" stroke-linecap="round"/><rect x="293.68" y="236.13" width="36" height="18" rx="3" fill="#d2d2d7"/><text x="338.68" y="237.13" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>at rest:</tspan></text><text x="338.68" y="252.13" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>length </tspan><tspan font-style="italic">r</tspan><tspan dy="3.22" font-size="8.28">0</tspan><tspan dy="-3.22">, angle </tspan><tspan font-style="italic">θ</tspan><tspan dy="3.22" font-size="8.28">0</tspan></text><line x1="200" y1="84" x2="200" y2="234" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M263.59 185.77A120 120 0 0 1 200 204" fill="none" stroke="#d2d2d7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="254.62" y="208.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e73" text-anchor="middle"><tspan font-style="italic">θ</tspan><tspan dy="3.64" font-size="9.36">0</tspan></text><path d="M216.67 156.1A74 74 0 0 1 200 158" fill="none" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="209.6" y="175.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="middle"><tspan font-style="italic">θ</tspan></text><path d="M200 84L222.67 182.05L216.33 185.67L230.91 186.6L218.22 193.84L232.8 194.77L220.11 202.01L234.69 202.94L221.99 210.18L236.58 211.12L223.88 218.36L238.47 219.29L225.77 226.53L240.36 227.46L234.01 231.08L256.68 329.13" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="249.68" y="320.13" width="36" height="18" rx="3" fill="#1d1d1f"/><path d="M236.6846602043089 323.1291382697209A21 21 0 0 1 254.6846602043089 308.1291382697209" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="84" r="5" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/><circle cx="256.68" cy="329.13" r="4.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/><line x1="312.68" y1="269.13" x2="273.58" y2="269.13" stroke="#0071e3" stroke-width="1.75" stroke-linecap="butt"/><polygon points="268.68,269.13 275.19,266.53 275.19,271.73" fill="#0071e3" stroke-linejoin="round"/><text x="320.68" y="273.13" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>1  preload: toward the wall</tspan></text><line x1="268.68" y1="277.13" x2="268.68" y2="310.23" stroke="#0071e3" stroke-width="1.75" stroke-linecap="butt"/><polygon points="268.68,315.13 266.09,308.63 271.28,308.63" fill="#0071e3" stroke-linejoin="round"/><text x="276.68" y="295.13" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>2  drag: down the wall</tspan></text><text x="250.68" y="359.13" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>base (the foot)</tspan></text><line x1="200" y1="76" x2="200" y2="34.3" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="200,28 203.34,36.36 196.66,36.36" fill="#0071e3" stroke-linejoin="round"/><text x="210" y="42" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">s</tspan></text><text x="232" y="42" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>holds the spine up</tspan></text><line x1="192" y1="84" x2="128.3" y2="84" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="122,84 130.36,80.66 130.36,87.34" fill="#0071e3" stroke-linejoin="round"/><text x="114" y="80" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan>−</tspan><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">n</tspan></text><text x="114" y="96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="end"><tspan>holds it in</tspan></text><text x="214" y="88" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>tip: a pin on its ledge</tspan></text><text x="486" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1d1f"><tspan font-style="italic">k</tspan><tspan dy="3.92" font-size="10.08">r</tspan></text><text x="486" y="154" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>stretch along the stalk</tspan></text><text x="486" y="170" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>carries the load; its travel lets</tspan></text><text x="486" y="184" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>spines that catch late catch up</tspan></text><line x1="480" y1="140" x2="234.81" y2="186.95" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="486" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1d1f"><tspan font-style="italic">k</tspan><tspan dy="3.92" font-size="10.08">θ</tspan></text><text x="486" y="350" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>weak torsion spring at the base</tspan></text><text x="486" y="366" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>presses the tip lightly on the wall</tspan></text><text x="486" y="380" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>so it can find a ledge</tspan></text><line x1="480" y1="336" x2="252.68" y2="303.13" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/></svg>
