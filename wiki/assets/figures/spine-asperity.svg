<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-labelledby="t"><title id="t">A spine tip resting on a ledge, and how tip size limits which ledges it can use</title><desc>Panel A: a spine tip of radius r-s rests on a ledge of a rough wall. The ledge holds any load that points down the wall and up to theta-max away from it. Panel B: a small tip seats on small ledges; a large tip rides over them and only holds on a ledge of its own size.</desc><rect x="0" y="0" width="720" height="336" fill="#ffffff"/><line x1="424" y1="20" x2="424" y2="316" stroke="#e8e8ed" stroke-width="1" stroke-linecap="round"/><text x="24" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>A</tspan></text><text x="42" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>One tip on one ledge</tspan></text><polygon points="24,52 130,52 126,84 132,116 128,146 130,180 174,170 181,178 178,198 166,216 150,234 136,252 130,278 134,300 130,316 24,316" fill="#e8e8ed" stroke-linejoin="round"/><path d="M130 52L126 84L132 116L128 146L130 180L174 170L181 178L178 198L166 216L150 234L136 252L130 278L134 300L130 316" fill="none" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><polygon points="156.38,170.39 228.99,77.04 194.17,53.55 134.82,155.85" fill="#48484a" stroke-linejoin="round"/><circle cx="145.6" cy="163.12" r="13" fill="#48484a"/><text x="64" y="100" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>wall</tspan></text><line x1="246" y1="74" x2="214" y2="88" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="250" y="76" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f"><tspan>spine</tspan></text><line x1="155.6" y1="165.12" x2="196" y2="138" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="200" y="142" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>tip, radius </tspan><tspan font-style="italic">r</tspan><tspan dy="3.36" font-size="8.64">s</tspan></text><text x="40" y="204" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f"><tspan>ledge</tspan></text><text x="40" y="219" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>(a usable</tspan></text><text x="40" y="233" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>asperity)</tspan></text><line x1="84" y1="200" x2="140" y2="179" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="296" y="116" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f"><tspan>Load directions</tspan></text><text x="296" y="131" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f"><tspan>this ledge can hold</tspan></text><path d="M300 150L354.36 261.45A124 124 0 0 1 300 274Z" fill="#e5f4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="300" y1="150" x2="300" y2="286" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="300" y1="150" x2="359.62" y2="272.24" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round"/><line x1="300" y1="150" x2="317.88" y2="241.98" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="319.08,248.16 314.21,240.6 320.76,239.32" fill="#0071e3" stroke-linejoin="round"/><path d="M311.07 206.93A58 58 0 0 1 300 208" fill="none" stroke="#0071e3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="150" r="4" fill="#48484a"/><text x="292" y="212" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">θ</tspan><tspan dy="3.36" font-size="8.64">load</tspan></text><text x="326" y="256" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan font-style="italic">F</tspan></text><text x="360" y="276" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a7f37"><tspan font-style="italic">θ</tspan><tspan dy="3.5" font-size="9">max</tspan></text><text x="292" y="300" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73" text-anchor="end"><tspan>down</tspan></text><text x="292" y="313" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73" text-anchor="end"><tspan>the wall</tspan></text><text x="442" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>B</tspan></text><text x="460" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>The same wall, two tip sizes</tspan></text><polygon points="442,52 480,52 480,76 480,92 491,89 493,96 487,104 480,110 480,120 480,136 491,133 493,140 487,148 480,154 480,164 480,180 491,177 493,184 487,192 480,198 480,222 480,252 516,245 521,256 511,280 490,300 480,308 480,316 442,316" fill="#e8e8ed" stroke-linejoin="round"/><path d="M480 52L480 76L480 92L491 89L493 96L487 104L480 110L480 120L480 136L491 133L493 140L487 148L480 154L480 164L480 180L491 177L493 184L487 192L480 198L480 222L480 252L516 245L521 256L511 280L490 300L480 308L480 316" fill="none" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="485.2" cy="84.8" r="5.5" fill="#48484a"/><text x="508" y="82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f"><tspan>small tip</tspan></text><text x="508" y="97" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>seats on any small ledge</tspan></text><circle cx="507.6" cy="158" r="25" fill="none" stroke="#6e6e73" stroke-width="1.25" stroke-dasharray="4 3"/><text x="544" y="154" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f"><tspan>large tip</tspan></text><text x="544" y="169" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>rides over them …</tspan></text><circle cx="507.63" cy="221.16" r="25" fill="#48484a"/><text x="544" y="222" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>… and holds only on</tspan></text><text x="544" y="236" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>a ledge its own size</tspan></text></svg>
