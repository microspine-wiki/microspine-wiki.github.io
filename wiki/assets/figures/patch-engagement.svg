<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-labelledby="t"><title id="t">Stable engagement of a large patch: joint position relative to the theta-max line</title><desc>A patch on a rigid backing is tilted so its top edge touches the wall first. The joint that loads it sits in a stable region: lower than the point where the wall force acts on the patch, and farther from the wall than a line drawn from that point at theta-max. From there any load between pure shear and theta-max rotates the patch flat against the wall.</desc><rect x="0" y="0" width="720" height="396" fill="#ffffff"/><rect x="54" y="40" width="56" height="324" fill="#e8e8ed"/><line x1="110" y1="40" x2="110" y2="364" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="butt"/><text x="82" y="344" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle"><tspan>wall</tspan></text><polygon points="114.27,109.9 222.06,352 452,352 452,109.9" fill="#e5f4ea" stroke-linejoin="round"/><line x1="114.27" y1="109.9" x2="228.29" y2="366" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round"/><line x1="114.27" y1="109.9" x2="452" y2="109.9" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round"/><text x="444" y="131.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="end"><tspan>stable region for the joint</tspan></text><polygon points="112,84 129.08,279.25 135.06,278.73 117.98,83.48" fill="#eb6834" stroke-linejoin="round"/><polygon points="117.98,83.48 135.06,278.73 147.01,277.69 129.93,82.43" fill="#48484a" stroke-linejoin="round"/><line x1="140.22" y1="199.98" x2="262" y2="214" stroke="#48484a" stroke-width="5" stroke-linecap="round"/><path d="M247 202A19 19 0 1 1 271 231" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="262" cy="214" r="7.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/><line x1="114.27" y1="109.9" x2="100.75" y2="54.02" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="99.27,47.9 104.48,55.24 97.99,56.81" fill="#0071e3" stroke-linejoin="round"/><text x="92.27" y="41.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">patch</tspan></text><line x1="262" y1="223" x2="275.73" y2="289.83" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="277,296 272.05,288.48 278.59,287.14" fill="#0071e3" stroke-linejoin="round"/><text x="286" y="294" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">joint</tspan></text><line x1="208.7" y1="322" x2="208.7" y2="258" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M189.99 279.98A46 46 0 0 1 208.7 276" fill="none" stroke="#1a7f37" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="216.7" y="282" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37"><tspan font-style="italic">θ</tspan><tspan dy="3.64" font-size="9.36">max</tspan></text><circle cx="146" cy="306" r="7.5" fill="none" stroke="#c0001a" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="155" y1="312" x2="252" y2="366" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="258" y="370" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>a joint here can turn the patch either way: the bottom may peel</tspan></text><line x1="134" y1="80" x2="196" y2="62" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="200" y="58" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>tilted a few degrees so the top edge touches first</tspan></text><line x1="274" y1="206" x2="300" y2="168" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="304" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>ball joint and torsion</tspan></text><text x="304" y="168" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>spring </tspan><tspan font-style="italic">k</tspan><tspan dy="3.36" font-size="8.64">φ</tspan></text><text x="498" y="96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>Any load between pure shear and </tspan><tspan font-style="italic">θ</tspan><tspan dy="3.36" font-size="8.64">max</tspan></text><text x="498" y="112" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>now turns the patch the same way:</tspan></text><text x="498" y="128" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>flat against the wall.</tspan></text><text x="498" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>Size </tspan><tspan font-style="italic">k</tspan><tspan dy="3.36" font-size="8.64">φ</tspan><tspan dy="-3.36"> so the patch is just parallel</tspan></text><text x="498" y="176" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>to the wall at the largest load.</tspan></text><text x="498" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>Keep the joint close to the wall:</tspan></text><text x="498" y="224" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>a long standoff multiplies every</tspan></text><text x="498" y="240" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>error in load direction.</tspan></text></svg>
