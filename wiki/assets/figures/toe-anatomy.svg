<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t"><title id="t">Schematic of the RiSE and Z-Man spine toe</title><desc>A hook is cast into a hard body. Two shear flexures join the body to a rigid link that pivots on a pin. A soft, pre-stretched normal flexure runs from the link to an anchor pin. An overload pin rides in a window of the body. The three pins are fixed in side plates that form the foot. Pulling the foot down the wall stretches the shear flexures while the ledge holds the hook.</desc><rect x="0" y="0" width="720" height="430" fill="#ffffff"/><polygon points="40,36 150,36 146,78 151,112 163,110 165,116 157,132 150,150 147,204 152,254 149,306 151,356 150,398 40,398" fill="#e8e8ed" stroke-linejoin="round"/><path d="M150 36L146 78L151 112L163 110L165 116L157 132L150 150L147 204L152 254L149 306L151 356L150 398" fill="none" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>wall</tspan></text><polygon points="262,126 398,214 212,334" fill="none" stroke="#d2d2d7" stroke-width="1.5" stroke-linejoin="round"/><path d="M204 70L292 64Q316 66 320 96L322 172Q318 214 296 242L270 270L206 270Q196 268 196 256L196 82Q196 72 204 70Z" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="96" width="68" height="122" rx="16" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.5"/><path d="M159 110C150 92 172 72 214 80" fill="none" stroke="#48484a" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 318L292 312Q340 306 356 298Q368 306 358 322Q340 332 292 338L206 348Q192 342 194 328Q194 320 200 318Z" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M216 270L216 277.36L211 279.31L221 283.23L211 287.13L221 291.05L211 294.95L221 298.87L211 302.77L221 306.69L216 308.64L216 316" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 270L256.24 277.04L252.07 280.43L262.79 281.13L254.45 287.91L265.17 288.61L256.83 295.39L267.55 296.09L259.21 302.87L269.93 303.57L265.76 306.96L268 314" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M356 304L361.88 292.24L367.61 291.96L361.19 282.44L372.65 281.88L366.23 272.36L377.69 271.8L371.27 262.28L382.73 261.72L376.31 252.2L387.77 251.64L381.35 242.12L392.81 241.56L386.39 232.04L392.12 231.76L398 220" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="262" cy="126" r="6.5" fill="#1d1d1f"/><circle cx="398" cy="214" r="6.5" fill="#1d1d1f"/><circle cx="212" cy="334" r="7.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.75"/><circle cx="212" cy="334" r="2.6" fill="#1d1d1f"/><line x1="282" y1="128" x2="282" y2="201.8" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="282,206 279.77,200.43 284.23,200.43" fill="#6e6e73" stroke-linejoin="round"/><line x1="212" y1="360" x2="212" y2="403" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="butt"/><polygon points="212,410 208.29,400.71 215.71,400.71" fill="#1d1d1f" stroke-linejoin="round"/><text x="226" y="396" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>the foot pulls down the wall</tspan></text><line x1="159" y1="104" x2="159" y2="64.3" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="159,58 162.34,66.36 155.66,66.36" fill="#0071e3" stroke-linejoin="round"/><text x="170" y="54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>ledge holds the hook</tspan></text><circle cx="214" cy="172" r="9.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.25"/><text x="214" y="176" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>1</tspan></text><circle cx="310" cy="324" r="9.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.25"/><text x="310" y="328" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>2</tspan></text><circle cx="196" cy="293" r="9.5" fill="#ffffff" stroke="#eb6834" stroke-width="1.25"/><text x="196" y="297" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>3</tspan></text><circle cx="284" cy="290" r="9.5" fill="#ffffff" stroke="#eb6834" stroke-width="1.25"/><text x="284" y="294" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>4</tspan></text><circle cx="408" cy="266" r="9.5" fill="#ffffff" stroke="#0071e3" stroke-width="1.25"/><text x="408" y="270" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>5</tspan></text><circle cx="240" cy="124" r="9.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.25"/><text x="240" y="128" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>6</tspan></text><circle cx="186" cy="348" r="9.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.25"/><text x="186" y="352" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>7</tspan></text><circle cx="420" cy="210" r="9.5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.25"/><text x="420" y="214" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan>8</tspan></text><text x="452" y="92" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>1</tspan></text><text x="486" y="92" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>hard body with the hook cast in</tspan></text><text x="452" y="119" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>2</tspan></text><text x="486" y="119" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>rigid link that turns on pin 7</tspan></text><text x="452" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>3, 4</tspan></text><line x1="452" y1="152" x2="476" y2="152" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><text x="486" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>shear flexures (stretch along the wall)</tspan></text><text x="452" y="173" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>5</tspan></text><line x1="452" y1="179" x2="460" y2="179" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/><text x="486" y="173" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>normal flexure (soft, stretched at rest)</tspan></text><text x="452" y="200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>6</tspan></text><text x="486" y="200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>overload pin in a window of the body</tspan></text><text x="452" y="227" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>7</tspan></text><text x="486" y="227" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>pivot pin</tspan></text><text x="452" y="254" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f"><tspan>8</tspan></text><text x="486" y="254" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>anchor pin</tspan></text><text x="452" y="300" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>Pins 6, 7 and 8 are fixed in the side plates,</tspan></text><text x="452" y="316" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>so they move together with the foot.</tspan></text><line x1="446" y1="296" x2="360" y2="240" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/></svg>
