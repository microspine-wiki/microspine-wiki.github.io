<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-labelledby="t"><title id="t">Statics of a limbed climber on a vertical wall</title><desc>Panel A: weight W acts at the centre of mass a distance h from the wall. Hands a height L above the feet must pull into the wall with T equal to W h over L, and the feet push out with the same force. Panel B: a spine pad can only supply an inward pull T together with a shear V-h of at least T over tan theta-max, so the pulling hand must also carry a large share of the weight.</desc><rect x="0" y="0" width="720" height="396" fill="#ffffff"/><line x1="412" y1="20" x2="412" y2="380" stroke="#e8e8ed" stroke-width="1" stroke-linecap="round"/><text x="24" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>A</tspan></text><text x="42" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>Forces on the climber</tspan></text><rect x="70" y="50" width="62" height="310" fill="#e8e8ed"/><line x1="132" y1="50" x2="132" y2="360" stroke="#8e8e93" stroke-width="1.75" stroke-linecap="butt"/><rect x="204" y="132" width="64" height="166" rx="22" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="1.75"/><line x1="214" y1="150" x2="136" y2="96" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/><line x1="214" y1="282" x2="136" y2="318" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/><circle cx="136" cy="96" r="6" fill="#0071e3"/><circle cx="136" cy="318" r="6" fill="#1d1d1f"/><circle cx="236" cy="214" r="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.75"/><path d="M236 205A9 9 0 0 1 245 214L236 214Z" fill="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 223A9 9 0 0 1 227 214L236 214Z" fill="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="132" y1="248" x2="236" y2="248" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><line x1="132" y1="242" x2="132" y2="254" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><line x1="236" y1="242" x2="236" y2="254" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="184" y="266" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1d1d1f" text-anchor="middle"><tspan font-style="italic">h</tspan></text><line x1="92" y1="96" x2="92" y2="318" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><line x1="86" y1="96" x2="98" y2="96" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><line x1="86" y1="318" x2="98" y2="318" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/><text x="82" y="211" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">L</tspan></text><line x1="236" y1="226" x2="236" y2="291" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="butt"/><polygon points="236,298 232.29,288.71 239.71,288.71" fill="#1d1d1f" stroke-linejoin="round"/><text x="246" y="294" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f"><tspan font-style="italic">W</tspan></text><line x1="136" y1="88" x2="136" y2="52.3" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="136,46 139.34,54.36 132.66,54.36" fill="#0071e3" stroke-linejoin="round"/><text x="146" y="62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">V</tspan><tspan dy="3.64" font-size="9.36">h</tspan></text><line x1="128" y1="96" x2="88.3" y2="96" stroke="#0071e3" stroke-width="2.25" stroke-linecap="butt"/><polygon points="82,96 90.36,92.66 90.36,99.34" fill="#0071e3" stroke-linejoin="round"/><text x="104" y="86" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="middle"><tspan font-style="italic">T</tspan></text><line x1="136" y1="310" x2="136" y2="280.3" stroke="#1d1d1f" stroke-width="2.25" stroke-linecap="butt"/><polygon points="136,274 139.34,282.36 132.66,282.36" fill="#1d1d1f" stroke-linejoin="round"/><text x="146" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">V</tspan><tspan dy="3.64" font-size="9.36">f</tspan></text><line x1="144" y1="318" x2="183.7" y2="318" stroke="#1d1d1f" stroke-width="2.25" stroke-linecap="butt"/><polygon points="190,318 181.64,321.34 181.64,314.66" fill="#1d1d1f" stroke-linejoin="round"/><text x="194" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">N</tspan></text><text x="288" y="106" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>hands pull in</tspan></text><text x="288" y="122" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">T</tspan><tspan> = </tspan><tspan font-style="italic">W</tspan><tspan> </tspan><tspan font-style="italic">h</tspan><tspan> / </tspan><tspan font-style="italic">L</tspan></text><text x="288" y="316" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f"><tspan>feet push out</tspan></text><text x="288" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">N</tspan><tspan> = </tspan><tspan font-style="italic">T</tspan></text><text x="288" y="214" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">V</tspan><tspan dy="3.64" font-size="9.36">h</tspan><tspan dy="-3.64"> + </tspan><tspan font-style="italic">V</tspan><tspan dy="3.64" font-size="9.36">f</tspan><tspan dy="-3.64"> = </tspan><tspan font-style="italic">W</tspan></text><text x="432" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>B</tspan></text><text x="450" y="30" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>What the hand can supply</tspan></text><path d="M520 300L457.71 82.75A226 226 0 0 1 520 74Z" fill="#e5f4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="520" y1="300" x2="520" y2="62" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="520" y1="300" x2="454.4" y2="71.22" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round"/><path d="M484.72 176.96A128 128 0 0 1 520 172" fill="none" stroke="#1a7f37" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="476" y="162" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" text-anchor="end"><tspan font-style="italic">θ</tspan><tspan dy="3.64" font-size="9.36">max</tspan></text><line x1="476" y1="120.32" x2="520" y2="120.32" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="476" y1="300" x2="476" y2="120.32" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="520" y1="300" x2="477.66" y2="127.12" stroke="#0071e3" stroke-width="2.5" stroke-linecap="butt"/><polygon points="476,120.32 481.81,128.46 474.61,130.23" fill="#0071e3" stroke-linejoin="round"/><line x1="520" y1="300" x2="481.6" y2="300" stroke="#0071e3" stroke-width="1.75" stroke-linecap="butt"/><polygon points="476,300 483.43,297.03 483.43,302.97" fill="#0071e3" stroke-linejoin="round"/><line x1="520" y1="300" x2="520" y2="125.92" stroke="#0071e3" stroke-width="1.75" stroke-linecap="butt"/><polygon points="520,120.32 522.97,127.75 517.03,127.75" fill="#0071e3" stroke-linejoin="round"/><circle cx="520" cy="300" r="5" fill="#0071e3"/><text x="498" y="318" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="middle"><tspan font-style="italic">T</tspan></text><text x="530" y="210.16" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">V</tspan><tspan dy="3.64" font-size="9.36">h</tspan></text><text x="530" y="228.16" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>must be at least</tspan></text><text x="530" y="244.16" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f"><tspan font-style="italic">T</tspan><tspan> / tan </tspan><tspan font-style="italic">θ</tspan><tspan dy="3.64" font-size="9.36">max</tspan></text><text x="530" y="78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73"><tspan>up the wall</tspan></text><text x="442" y="294" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6e6e73" text-anchor="end"><tspan>into the wall</tspan></text><text x="432" y="348" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>Spines pull inward only while they are also</tspan></text><text x="432" y="364" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>carrying shear. A hand that must hold </tspan><tspan font-style="italic">T</tspan><tspan> is</tspan></text><text x="432" y="380" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>therefore forced to carry much of the weight.</tspan></text></svg>
