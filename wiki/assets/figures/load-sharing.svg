<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t"><title id="t">Load sharing between three spines for a constant-stiffness suspension and for a radial loading line</title><desc>Two force-space panels with the same adhesion limit. With a constant-stiffness suspension the three spines lie on a straight line that misses the origin, so each pulls at a different angle and the least-stretched one falls outside the limit. With a radial loading line all three pull at the same angle and stay inside.</desc><rect x="0" y="0" width="720" height="300" fill="#ffffff"/><path d="M54 104L54 74L288.1 74A236 236 0 0 1 274.3 188.6Z" fill="#e5f4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="54" y1="104" x2="274.32" y2="188.57" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round"/><line x1="38" y1="104" x2="320.4" y2="104" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="326,104 318.57,106.97 318.57,101.03" fill="#6e6e73" stroke-linejoin="round"/><line x1="54" y1="222" x2="54" y2="65.6" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="54,60 56.97,67.43 51.03,67.43" fill="#6e6e73" stroke-linejoin="round"/><text x="324" y="95" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">s</tspan></text><text x="46" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">n</tspan></text><text x="272.32" y="206.57" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a7f37" text-anchor="end"><tspan>adhesion limit of this wall</tspan></text><line x1="54" y1="126" x2="280" y2="159.31" stroke="#0071e3" stroke-width="2.25" stroke-linecap="round"/><line x1="54" y1="104" x2="134" y2="137.79" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="134" cy="137.79" r="6" fill="#c0001a" stroke="#ffffff" stroke-width="2"/><text x="141" y="126.79" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73"><tspan>caught last</tspan></text><line x1="54" y1="104" x2="194" y2="146.63" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="194" cy="146.63" r="6" fill="#0071e3" stroke="#ffffff" stroke-width="2"/><text x="201" y="135.63" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73"><tspan>middle</tspan></text><line x1="54" y1="104" x2="254" y2="155.47" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="254" cy="155.47" r="6" fill="#0071e3" stroke="#ffffff" stroke-width="2"/><text x="261" y="144.47" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73"><tspan>caught first</tspan></text><text x="38" y="34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>A</tspan></text><text x="56" y="34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>Constant stiffness: one line, three angles</tspan></text><text x="38" y="254" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>The spine that caught last is stretched least, pulls</tspan></text><text x="38" y="270" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>at the steepest angle, and slips first (red).</tspan></text><path d="M416 104L416 74L650.1 74A236 236 0 0 1 636.3 188.6Z" fill="#e5f4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="416" y1="104" x2="636.32" y2="188.57" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round"/><line x1="400" y1="104" x2="682.4" y2="104" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="688,104 680.57,106.97 680.57,101.03" fill="#6e6e73" stroke-linejoin="round"/><line x1="416" y1="222" x2="416" y2="65.6" stroke="#6e6e73" stroke-width="1.25" stroke-linecap="butt"/><polygon points="416,60 418.97,67.43 413.03,67.43" fill="#6e6e73" stroke-linejoin="round"/><text x="686" y="95" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">s</tspan></text><text x="408" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="3.64" font-size="9.36">n</tspan></text><text x="634.32" y="206.57" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a7f37" text-anchor="end"><tspan>adhesion limit of this wall</tspan></text><line x1="416" y1="104" x2="642" y2="164.56" stroke="#0071e3" stroke-width="2.25" stroke-linecap="round"/><line x1="416" y1="104" x2="496" y2="125.44" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="496" cy="125.44" r="6" fill="#0071e3" stroke="#ffffff" stroke-width="2"/><text x="503" y="114.44" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73"><tspan>caught last</tspan></text><line x1="416" y1="104" x2="556" y2="141.51" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="556" cy="141.51" r="6" fill="#0071e3" stroke="#ffffff" stroke-width="2"/><text x="563" y="130.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73"><tspan>middle</tspan></text><line x1="416" y1="104" x2="616" y2="157.59" stroke="#6e6e73" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="616" cy="157.59" r="6" fill="#0071e3" stroke="#ffffff" stroke-width="2"/><text x="623" y="146.59" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73"><tspan>caught first</tspan></text><text x="400" y="34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>B</tspan></text><text x="418" y="34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f"><tspan>Radial loading line: one angle for all</tspan></text><text x="400" y="254" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>Every spine reaches the limit at the same moment,</tspan></text><text x="400" y="270" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73"><tspan>whatever the limit of the wall happens to be.</tspan></text><line x1="384" y1="24" x2="384" y2="284" stroke="#e8e8ed" stroke-width="1" stroke-linecap="round"/></svg>
